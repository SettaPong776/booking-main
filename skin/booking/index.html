<!DOCTYPE html>
<html lang="{LANGUAGE}" dir="ltr" class="smooth">

<head>
  <meta charset=utf-8>
  <meta name=viewport content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="{WEBURL}favicon.ico">
  <meta name="author" content="Kotchasan.com">
  <title>{TITLE}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel=stylesheet href="index.php/css/view/index?{REV}">
  <script src="index.php/js/view/index/{LANGUAGE}?{REV}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Fix for SweetAlert2 z-index to be on top of Kotchasan modals */
    .swal2-container { z-index: 10000 !important; }
  </style>
</head>

<body class="responsive {BODYCLASS}">
  <div id=slidemenu_content>
    <div class="wrapper bg_image bg_color">
      <div id="toTop">
        <div>
          <header class="header" id="scroll-to">
            <div class="menu_wrapper menu_bg">
              <nav id=topmenu class="topmenu slidemenu">
                <ul>{MENUS}{LOGIN}</ul>
              </nav>
            </div>
            <div class=header_btn_wrapper>
              {LINE}
              <a id=dark_mode class="header_btn {DARKMODE}" title="{LNG_Dark mode}"></a>
              <div class="icon-language language-menu header_btn" title="{LNG_Change language}" data-text="{LANGUAGE}">
                <ul>{LANGUAGES}</ul>
              </div>
            </div>
          </header>
          <div class="hero-banner">
            <div class="gcss-wrapper center">
              <div id="logo" class="logo_color">
                <h1><a href="{WEBURL}index.php" title="{WEBTITLE}" class="{LOGO_CLASS}">{LOGO}</a></h1>
                <h4>{WEBDESCRIPTION}</h4>
              </div>
            </div>
          </div>
        </div>
        <div id="skip" class="gcss-wrapper clear">
          <main id="content" class="border-color">{MAIN}</main>
        </div>
      </div>
      <footer class="footer">
        <p class=copy></p>
      </footer>
    </div>
  </div>
  <a href=#scroll-to class=scroller title="{LNG_scroll to top}">^</a>
  <script>
    $G(window).Ready(function() {
      initWeb();
    });
    // Override window.alert globally to use SweetAlert2
    window.alert = function(msg) {
      if (!msg) return;
      var strMsg = String(msg);
      var isError = strMsg.toLowerCase().indexOf('error') !== -1 || strMsg.toLowerCase().indexOf('fail') !== -1 || strMsg.toLowerCase().indexOf('ไม่สำเร็จ') !== -1;
      var isSuccess = strMsg.toLowerCase().indexOf('success') !== -1 || strMsg.toLowerCase().indexOf('เรียบร้อย') !== -1 || strMsg.toLowerCase().indexOf('บันทึก') !== -1;
      
      Swal.fire({
        icon: isError ? 'error' : (isSuccess ? 'success' : 'info'),
        title: 'ระบบแจ้งเตือน',
        html: strMsg,
        confirmButtonColor: '#3085d6',
        confirmButtonText: 'ตกลง'
      });
    };
  </script>
</body>

</html>
